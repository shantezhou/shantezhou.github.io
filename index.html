<!--
THESIS: A blog that is only its text — the entire interface is typography; refuses the card-grid blog index and every piece of chrome.
OWN-WORLD: Pure #fff paper, pure #000 ink, nothing else; JetBrains Mono for every character; 1px rules are the only structure; hover and selection invert ink and paper.
STORY: The reader lands on a name, one subject line, and a dated list; a click opens a post set like a beautifully kept terminal page; they read, they leave.
FIRST VIEWPORT: Bold name top-left, tagline beneath, then the dated post list — no hero, no nav bar, no imagery.
FORM: Brief-pinned direction (white/black, JetBrains Mono, ultra-minimal, HTML+CSS only); pinned brief beats the roll, no concept seed run.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

    <h1>Shante Zhou</h1>
    <nav class="site-links">

  </header>

  <main>

        <p class="post-summary">One or two honest lines about the post.</p>
        <time datetime="YYYY-MM-DD">YYYY-MM-DD</time>

    -->
  </main>

</body>
